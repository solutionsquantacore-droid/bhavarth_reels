name: Update SadhanPath Shorts

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch: # Allows you to trigger it manually from the GitHub Actions tab

jobs:
  update-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run script
        run: python update_shorts.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add sadhanpath_shorts.json
          
          # Only commit and push if the JSON file actually changed (i.e. new shorts were found)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update shorts JSON" && git push)
